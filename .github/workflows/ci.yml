name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: root-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-timeout respx psutil hypothesis pytest-cov

      - name: Dependency consistency
        run: python -m pip check

      - name: Run full root test suite (offline; browser tests skip without Chromium)
        env:
          WEBINTEL_LIVE_TESTS: "0"
        run: |
          pytest tests -q --timeout=120

      - name: Run canonical WebLens test suite + drift guard
        run: |
          pytest weblens/tests -q --timeout=120
          pytest weblens/tests/test_mirror_drift.py -q

      - name: Measure tool schema token overhead
        run: |
          python -c "from src.server.token_counter import measure_tool_schema_tokens; res = measure_tool_schema_tokens(); assert res['total_o200k'] < 1000, f'Too many schema tokens: {res}'"

  docker:
    name: Docker image build + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t weblens:ci .

      - name: Smoke test image contents
        run: docker run --rm weblens:ci python -m weblens.cli tokens --pretty
