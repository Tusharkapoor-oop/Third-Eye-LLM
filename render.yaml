# Render Blueprint for the WebLens MCP server (Streamable HTTP on /mcp).
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Render sets PORT; the Dockerfile CMD binds it on 0.0.0.0.
#
# WEBLENS_HTTP_TOKEN is intentionally `sync: false`: Render prompts for it at
# deploy time and stores it as a secret. The server refuses to start on a
# non-loopback bind without it, so an accidentally public MCP endpoint fails
# closed instead of exposing every tool to the internet.
#
# The hostname below MUST match the service name (Render derives the URL as
# https://<name>.onrender.com). The MCP transport's DNS-rebinding guard
# validates the Host header; a stale or missing entry makes every /mcp request
# return 421 while /healthz still reports healthy.
services:
  - type: web
    name: weblens-mcp
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WEBLENS_HTTP_TOKEN
        sync: false
      - key: WEBLENS_ALLOWED_HOSTS
        value: weblens-mcp.onrender.com
      - key: WEBLENS_ALLOWED_ORIGINS
        value: https://weblens-mcp.onrender.com
      - key: WEBLENS_MCP_PROFILE
        value: full
      # Render's filesystem is ephemeral; /tmp is the only writable path the
      # unprivileged container user is guaranteed to own.
      - key: WEBLENS_CACHE_DIR
        value: /tmp/weblens
      - key: WEBLENS_SEARCH_PROVIDERS
        value: mwmbl,wikipedia,bing,yahoo
      # Optional: adds the hosted fast path. Leave blank to stay keyless.
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
