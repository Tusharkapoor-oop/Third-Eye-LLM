[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-web-intelligence-engine"
version = "1.0.0"
description = "High-performance, token-efficient, local-first web intelligence engine for AI agents via MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Autonomous Engineering Team" }
]
dependencies = [
    "mcp>=2.3.0",
    "mcp-types>=2.3.0",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "ddgs>=9.16.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pydantic>=2.13.0",
    "tiktoken>=0.14.0",
    "pymupdf>=1.28.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "psutil>=7.2.0"
]

[project.scripts]
web-intel-mcp = "src.server.mcp_server:main"
web-intel-bench = "benchmarks.run_benchmarks:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
