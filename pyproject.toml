[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-web-intelligence-engine"
version = "1.0.0"
description = "High-performance, token-efficient, local-first web intelligence engine for AI agents via MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Autonomous Engineering Team" }
]
dependencies = [
    "mcp>=2.3.0",
    "mcp-types>=2.3.0",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "ddgs>=9.16.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pydantic>=2.13.0",
    "tiktoken>=0.14.0",
    "pymupdf>=1.28.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
    "google-genai>=2.34.0",
    "tavily-python>=0.8.5",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.10",
    "playwright>=1.49.0",
    "aiosqlite>=0.22.1",
    "rich>=15.0.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "psutil>=7.2.0"
]
quality = [
    "aiosqlite>=0.20.0",
    "google-genai>=1.0.0",
    "tavily-python>=0.7.0",
    "flashrank>=0.2.9",
    "rank-bm25>=0.2.2",
    "rich>=13.9.0",
    "playwright>=1.49.0"
]
redis = [
    "redis>=5,<7"
]
hybrid = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
    "tokenizers>=0.20,<1"
]

[project.scripts]
web-intel-mcp = "src.server.mcp_server:main"
web-intel-bench = "benchmarks.run_benchmarks:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--timeout=60"
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.14",
    "inline-snapshot>=0.36.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
